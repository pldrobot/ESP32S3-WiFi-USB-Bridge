; ESP32-S3 WiFi USB Bridge
; One codebase, two roles:
;   TX = USB HOST   : the real USB peripheral is plugged into this ESP.
;   RX = USB DEVICE : this ESP is plugged into the PC and re-presents the peripheral.
; The two ESPs talk directly over ESP-NOW (no router) and pair automatically.
;
; Both USB roles need the OTG controller: build with USB mode 0 (TinyUSB / OTG), CDC off.
; Logs therefore go to UART0 (GPIO43/44), not the USB-C port. On the Super Mini the USB-C
; port is the only USB port: after the first flash hold BOOT while plugging in to re-flash.

[common]
platform  = espressif32
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Both ends must use the same key to pair. Change it to isolate several bridges.
    -DPAIR_KEY=0x50444C31u

[board_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_16mb.csv

[board_supermini]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size         = 4MB
board_build.flash_size          = 4MB
board_build.partitions          = partitions_4mb.csv
board_upload.maximum_size       = 4194304

[role_tx]
build_flags = -DROLE_TX=1

[role_rx]
build_flags = -DROLE_RX=1

[env:n16r8_tx]
extends     = common, board_n16r8
build_flags = ${common.build_flags} ${role_tx.build_flags}
upload_port = COM12        ; <-- set your USB serial port (e.g. COM3, /dev/ttyUSB0)
monitor_port = COM12       ; <-- set your USB serial port (e.g. COM3, /dev/ttyUSB0)

[env:n16r8_rx]
extends     = common, board_n16r8
build_flags = ${common.build_flags} ${role_rx.build_flags}

[env:supermini_tx]
extends     = common, board_supermini
build_flags = ${common.build_flags} ${role_tx.build_flags}

[env:supermini_rx]
extends     = common, board_supermini
build_flags = ${common.build_flags} ${role_rx.build_flags}
upload_port = COM5        ; <-- set your USB serial port (e.g. COM3, /dev/ttyUSB0)
