; ESP32-S3 WiFi USB Bridge: one codebase, four envs.
;   host   = USB HOST   : the real USB peripheral plugs into this ESP.
;   device = USB DEVICE : this ESP plugs into the PC and re-presents the peripheral.
; Pairing: hold BOOT (GPIO0) for 3 s to erase NVS and reboot into pairing mode; it pairs with the nearest
; unpaired device of the other side and stores the peer MAC in NVS.
;
; Both USB roles need the OTG controller: USB mode 0 (TinyUSB / OTG), CDC off.
; Logs therefore go to UART0 (GPIO43/44), not the USB-C port. On the Super Mini the USB-C
; port is the only USB port: after the first flash hold BOOT while plugging in to re-flash.
; Both boards have a WS2812 on GPIO48.

[common]
platform  = espressif32
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLED_WS2812_PIN=48

[board_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_16mb.csv

[board_supermini]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size         = 4MB
board_build.flash_size          = 4MB
board_build.partitions          = partitions_4mb.csv
board_upload.maximum_size       = 4194304

[role_host]
build_flags      = -DROLE_HOST=1
build_src_filter = +<*> -<usb_device.cpp>

[role_device]
build_flags      = -DROLE_DEVICE=1
build_src_filter = +<*> -<usb_host.cpp>

[env:host_n16r8]
extends          = common, board_n16r8, role_host
build_flags      = ${common.build_flags} ${role_host.build_flags}
upload_port      = COM12        ; <-- set your serial port
monitor_port     = COM12

[env:host_supermini]
extends          = common, board_supermini, role_host
build_flags      = ${common.build_flags} ${role_host.build_flags}

[env:device_n16r8]
extends          = common, board_n16r8, role_device
build_flags      = ${common.build_flags} ${role_device.build_flags}

[env:device_supermini]
extends          = common, board_supermini, role_device
build_flags      = ${common.build_flags} ${role_device.build_flags}
upload_port      = COM5         ; <-- set your serial port
monitor_port     = COM5
